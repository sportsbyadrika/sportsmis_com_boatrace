<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Results — SportsMIS® Regatta</title>
<meta name="description" content="Live race results.">
<meta name="rg-template" content="__TEMPLATE_VERSION__">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Self-contained on purpose: this page is served as a static file with no
     framework, so a phone on a crowded riverbank network fetches one HTML
     document and one JSON payload, nothing else. */
  :root{--navy:#0b1f3a;--water:#0ea5e9;--deep:#0369a1;--ink:#0f172a;--bg:#f1f5f9;
        --gold:#facc15;--silver:#cbd5e1;--bronze:#e8b485;--line:rgba(15,23,42,.08)}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  body.locked{overflow:hidden}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 14px}

  header.top{background:linear-gradient(145deg,var(--navy),var(--deep));color:#fff;padding:18px 0 20px}
  .lock{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);
        display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .brand{font-weight:700;line-height:1.05}
  .brand span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}
  h1{margin:0;font-size:clamp(20px,4.4vw,30px);font-weight:800;line-height:1.15}
  .sub{font-size:clamp(14px,3vw,18px);color:#bae6fd;margin-top:2px}
  .meta{font-size:13px;color:#cbd5e1;margin-top:6px}

  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
       padding:9px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar input,.bar select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid #cbd5e1;
       border-radius:9px;background:#fff;color:inherit;min-width:0}
  .bar input{flex:1 1 190px}
  .status{margin-left:auto;font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:0 0 auto}
  .dot.stale{background:#f59e0b}
  .dot.down{background:#ef4444}

  .grid{display:grid;gap:12px;padding:14px 0 28px;
        grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(15,23,42,.05);display:flex;flex-direction:column;cursor:pointer}
  .card:hover{box-shadow:0 4px 14px rgba(15,23,42,.10)}
  /* display:flex above out-ranks the browser's own [hidden] rule, so the
     search filter has to hide the card explicitly. */
  .card[hidden]{display:none}
  .thumb{aspect-ratio:16/7;background:#e2e8f0 center/cover no-repeat;position:relative}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             color:#94a3b8;font-size:30px}
  .pill{position:absolute;top:9px;right:9px;font-size:11px;font-weight:700;padding:4px 9px;
        border-radius:999px;color:#fff;letter-spacing:.02em;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .pill.final{background:#16a34a}.pill.round{background:#0369a1}.pill.none{background:#64748b}
  .cbody{padding:12px 13px 13px;display:flex;flex-direction:column;flex:1}
  .rno{font-size:11px;color:#64748b;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .rname{font-weight:700;font-size:16px;line-height:1.2;margin-top:1px}
  .rreg{font-size:13px;color:#475569}
  .rmeta{font-size:12px;color:#64748b;margin-top:4px}
  .rround{font-size:12px;color:var(--deep);font-weight:600;margin-top:7px}

  /* Placings / qualifiers / entries all share one row shape. The name and the
     club are BLOCK boxes: as inline spans they ignored the ellipsis rules and
     printed on top of the finishing time. */
  ol.places{list-style:none;margin:9px 0 0;padding:0}
  ol.places li{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
  ol.places li:first-child{border-top:0}
  .pos{min-width:24px;height:24px;padding:0 5px;border-radius:7px;flex:0 0 auto;display:flex;
       align-items:center;justify-content:center;font-weight:800;font-size:12px;background:#e2e8f0}
  li.p1 .pos{background:var(--gold)}li.p2 .pos{background:var(--silver)}li.p3 .pos{background:var(--bronze)}
  .who{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
  .boat,.club{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .boat{font-weight:600;font-size:14px;line-height:1.25}
  .club{font-size:12px;color:#64748b;line-height:1.3}
  .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--deep);
        flex:0 0 auto;white-space:nowrap;align-self:center}
  .note{font-size:12.5px;color:#64748b;margin-top:9px}
  .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;
        justify-content:space-between;gap:10px}
  .more{font-size:12.5px;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:5px}
  .more.rounds{color:#475569}
  .more .chev{font-weight:800}
  .qq{flex:0 0 auto;font-size:10px;font-weight:800;color:#166534;background:#dcfce7;
      border-radius:5px;padding:2px 5px;align-self:center}
  .time.out{color:#b91c1c;font-size:12px}

  .tally{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 26px;overflow:hidden}
  .tally h2{margin:0;padding:11px 14px;font-size:15px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:7px 14px;text-align:left;border-top:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b}
  td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}

  .empty{padding:40px 14px;text-align:center;color:#64748b}
  footer{padding:16px 0 30px;text-align:center;font-size:12px;color:#64748b}
  @media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
  @media (max-width:420px){.grid{grid-template-columns:1fr}}

  /* ── Detail view ──────────────────────────────────────────────────────────
     A dialog on a desktop, a bottom sheet on a phone. Every race is reachable
     at #race-<n>, so a result can be shared as a link and Back closes it. */
  #sheet{border:0;padding:0;background:#fff;color:inherit;width:calc(100% - 24px);max-width:560px;
         border-radius:16px;box-shadow:0 24px 60px rgba(2,6,23,.35);max-height:86vh;overflow:hidden}
  #sheet[open]{display:flex;flex-direction:column}
  #sheet::backdrop{background:rgba(2,6,23,.55)}
  .sh-head{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 11px;
           border-bottom:1px solid var(--line)}
  .sh-head h2{margin:1px 0 0;font-size:18px;line-height:1.2;font-weight:800}
  .sh-head .x{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:0;
              background:#f1f5f9;color:#475569;font-size:15px;line-height:1;cursor:pointer}
  .sh-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
            color:#fff;margin-top:8px}
  .sh-badge.final{background:#16a34a}.sh-badge.round{background:#0369a1}.sh-badge.none{background:#64748b}
  .sh-tabs{display:flex;gap:6px;padding:10px 14px 0}
  .sh-tabs button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:7px 10px;cursor:pointer;
                  border:1px solid var(--line);background:#f8fafc;color:#475569;border-radius:9px}
  .sh-tabs button[aria-selected="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
  .sh-body{padding:4px 14px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sh-body .heat{font-size:12.5px;font-weight:700;color:var(--ink);margin:10px 0 0}
  .sh-sec .when{font-weight:600;color:#94a3b8;text-transform:none;letter-spacing:0}
  .sh-body ol.places li{padding:9px 0;align-items:flex-start}
  .sh-body .boat{font-size:15px}
  /* There is room here, so the club and lane wrap rather than truncate. */
  .sh-body .club{white-space:normal;overflow:visible;text-overflow:clip}
  .sh-body .time{font-size:14px;padding-top:1px}
  .sh-sec{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;
          font-weight:700;margin:14px 0 0}
  .sh-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;
           gap:10px;font-size:12px;color:#64748b}
  .sh-foot button{margin-left:auto;font:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;
                  border-radius:9px;border:1px solid #cbd5e1;background:#fff;color:var(--deep);cursor:pointer}
  #shBack{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:40}
  @media (max-width:640px){
    #sheet{width:100%;max-width:none;max-height:88vh;border-radius:18px 18px 0 0;
           position:fixed;inset:auto 0 0 0;margin:0}
  }
  /* Fallback for browsers without dialog.showModal(). */
  #sheet.fb[open]{position:fixed;z-index:41;inset:auto 0 0 0;margin:0 auto}
  @media (min-width:641px){#sheet.fb[open]{inset:50% auto auto 50%;transform:translate(-50%,-50%)}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="lock">
      <div class="mark">⛵</div>
      <div class="brand">SportsMIS<sup style="font-size:.6em">®</sup><span>Regatta</span></div>
    </div>
    <h1 id="evName">Live Results</h1>
    <div class="sub" id="evReg"></div>
    <div class="meta" id="evMeta"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%">
    <input id="q" type="search" placeholder="Search race, boat or club" aria-label="Search">
    <select id="st" aria-label="Filter by result state">
      <option value="">All races</option>
      <option value="final">Final result</option>
      <option value="round">Round result</option>
      <option value="none">Not published</option>
    </select>
    <div class="status"><span class="dot" id="dot"></span><span id="stamp">Loading…</span></div>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="cards"></div>
  <div class="tally" id="tallyBox" hidden>
    <h2>Club Tally</h2>
    <table>
      <thead><tr><th>Club</th><th class="n">1st</th><th class="n">2nd</th><th class="n">3rd</th><th class="n">Points</th></tr></thead>
      <tbody id="tallyRows"></tbody>
    </table>
  </div>
</main>

<footer>Powered by <strong>SportsMIS<sup>®</sup></strong> Regatta</footer>

<div id="shBack" hidden></div>
<dialog id="sheet" aria-labelledby="shTitle">
  <div class="sh-head">
    <div style="min-width:0">
      <div class="rno" id="shNo"></div>
      <h2 id="shTitle"></h2>
      <div class="rreg" id="shReg"></div>
      <div class="rmeta" id="shMeta"></div>
      <span class="sh-badge" id="shBadge"></span>
    </div>
    <button class="x" id="shClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="sh-tabs" id="shTabs" role="tablist" hidden>
    <button type="button" id="tabResult" role="tab" data-view="result" aria-selected="true">Result</button>
    <button type="button" id="tabRounds" role="tab" data-view="rounds" aria-selected="false">Heats &amp; rounds</button>
  </div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot"><span id="shFoot"></span><button id="shShare" type="button" hidden>Copy link</button></div>
</dialog>

<script>
(function () {
  'use strict';

  // Served from the event's own directory, so every path is relative — the
  // page works unchanged behind a CDN or on another host.
  var MANIFEST = 'manifest.json';
  var POLL_MS  = 20000;   // manifest only; the payload is fetched on change
  var JITTER   = 7000;    // spread clients out so they never poll in lockstep
  var PREVIEW  = 3;       // rows shown on the card; the rest live in the sheet

  var el = function (id) { return document.getElementById(id); };
  var data = null, version = null, failures = 0;
  var bySl = {};          // race number -> race, for the detail view
  var sheet = el('sheet'), openSl = null, openView = 'result', pushed = false, lastFocus = null;
  var modal = typeof sheet.showModal === 'function';
  if (!modal) sheet.classList.add('fb');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function setStatus(text, cls) {
    el('stamp').textContent = text;
    el('dot').className = 'dot' + (cls ? ' ' + cls : '');
  }

  // ── Rows ───────────────────────────────────────────────────────────────
  // Placings, qualifiers and entries are the same three-part row: a badge, a
  // two-line name block that truncates, and an optional time.
  function rowHtml(x, detail) {
    var badge = x.pos ? String(x.pos) : (x.code ? x.code : '•');
    var under = x.club || '';
    if (detail && x.lane) under += (under ? ' · ' : '') + 'Lane\u00a0' + x.lane;
    if (detail && x.heat) under += (under ? ' · ' : '') + 'Heat\u00a0' + x.heat;
    return '<li' + (x.pos && x.pos <= 3 ? ' class="p' + x.pos + '"' : '') + '>' +
      '<span class="pos">' + esc(badge) + '</span>' +
      '<span class="who"><span class="boat">' + esc(x.boat) + '</span>' +
      (under ? '<span class="club">' + esc(under) + '</span>' : '') + '</span>' +
      (x.time ? '<span class="time">' + esc(x.time) + '</span>' : '') + '</li>';
  }

  function listHtml(rows, limit, detail) {
    var use = limit ? rows.slice(0, limit) : rows;
    return '<ol class="places">' + use.map(function (r) {
      return rowHtml(r, detail);
    }).join('') + '</ol>';
  }

  /** One heat's lanes, in finishing order. */
  function heatHtml(lanes) {
    if (!lanes || !lanes.length) return '<p class="note">No boats were drawn in this heat.</p>';
    return '<ol class="places">' + lanes.map(function (l) {
      var right = l.out ? '<span class="time out">' + esc(l.out) + '</span>'
                : (l.time ? '<span class="time">' + esc(l.time) + '</span>' : '');
      return '<li' + (l.pos && l.pos <= 3 && !l.out ? ' class="p' + l.pos + '"' : '') + '>' +
        '<span class="pos">' + (l.pos ? esc(l.pos) : '–') + '</span>' +
        '<span class="who"><span class="boat">' + esc(l.boat) + '</span>' +
        '<span class="club">' + esc(l.club) + ' · Lane\u00a0' + esc(l.lane) + '</span></span>' +
        right + (l.q ? '<span class="qq">Q</span>' : '') + '</li>';
    }).join('') + '</ol>';
  }

  /** Every published round of a race, heat by heat. */
  function roundsHtml(r) {
    if (!r.rounds || !r.rounds.length) {
      return '<p class="note">No round has been published for this race yet.</p>';
    }
    return r.rounds.map(function (rd) {
      var head = '<div class="sh-sec">' + esc(rd.name) +
        (rd.when ? ' <span class="when">· ' + esc(rd.when) + '</span>' : '') + '</div>';
      if (!rd.heats || !rd.heats.length) return head + '<p class="note">No heats recorded.</p>';
      // A single-heat round is its own heading; naming it "Heat 1" adds nothing.
      var one = rd.heats.length === 1;
      return head + rd.heats.map(function (h) {
        return (one ? '' : '<div class="heat">' + esc(h.name || ('Heat ' + h.no)) + '</div>') +
          heatHtml(h.lanes);
      }).join('');
    }).join('');
  }

  /** The rows a race shows, whichever of the three states it is in. */
  function rowsOf(r) {
    return (r.state === 'final' ? r.places : r.state === 'round' ? r.qualified : r.teams) || [];
  }

  function emptyNote(r) {
    return '<p class="note">' + (
      r.state === 'final' ? 'No placings recorded.' :
      r.state === 'round' ? 'No qualifiers recorded yet.' : 'No boats entered yet.') + '</p>';
  }

  function moreLabel(r, hidden) {
    if (hidden > 0) {
      return r.state === 'final' ? 'All ' + (rowsOf(r).length) + ' placings'
           : r.state === 'round' ? 'All ' + (rowsOf(r).length) + ' qualifiers'
           : 'All ' + (rowsOf(r).length) + ' boats';
    }
    return r.state === 'none' ? 'Race details' : 'Full result';
  }

  // ── Cards ──────────────────────────────────────────────────────────────
  function cardHtml(r) {
    var img  = r.image || (data.event && data.event.image) || '';
    var rows = rowsOf(r);
    var body = rows.length ? listHtml(rows, PREVIEW, false) : emptyNote(r);
    var hay  = ((r.name || '') + ' ' + (r.regional || '') + ' ' + (r.class || '') + ' ' +
                rows.map(function (x) { return (x.boat || '') + ' ' + (x.club || ''); }).join(' ')
               ).toLowerCase();

    return '<article class="card" tabindex="0" role="button" data-sl="' + esc(r.sl) +
        '" data-state="' + esc(r.state) + '" data-hay="' + esc(hay) +
        '" aria-label="Race ' + esc(r.sl) + ' ' + esc(r.name) + ' — ' + esc(r.label) + '">' +
      '<div class="thumb"' + (img ? ' style="background-image:url(\'' + esc(img) + '\')"' : '') + '>' +
        (img ? '' : '<div class="ph">⛵</div>') +
        '<span class="pill ' + esc(r.state) + '">' + esc(r.label) + '</span>' +
      '</div>' +
      '<div class="cbody">' +
        '<div class="rno">Race ' + esc(r.sl) + '</div>' +
        '<div class="rname">' + esc(r.name) + '</div>' +
        (r.regional ? '<div class="rreg">' + esc(r.regional) + '</div>' : '') +
        '<div class="rmeta">' +
          [r.gender, r.class, r.distance, r.when].filter(Boolean).map(esc).join(' · ') +
        '</div>' +
        (r.round && r.state !== 'none'
          ? '<div class="rround">' + esc(r.round) +
            (r.state === 'round' ? ' — qualified' : '') + '</div>'
          : '') +
        body +
        '<div class="foot">' +
          '<span class="more">' + esc(moreLabel(r, rows.length - PREVIEW)) +
            '<span class="chev">›</span></span>' +
          (r.rounds && r.rounds.length
            ? '<span class="more rounds" data-view="rounds">Heats &amp; rounds' +
              '<span class="chev">›</span></span>'
            : '') +
        '</div>' +
      '</div></article>';
  }

  // ── Detail view ────────────────────────────────────────────────────────
  function fillSheet(r) {
    var rows = rowsOf(r);
    el('shNo').textContent    = 'Race ' + r.sl;
    el('shTitle').textContent = r.name || '';
    el('shReg').textContent   = r.regional || '';
    el('shMeta').textContent  = [r.gender, r.class, r.distance, r.when].filter(Boolean).join(' · ');
    el('shBadge').textContent = r.label || '';
    el('shBadge').className   = 'sh-badge ' + (r.state || 'none');

    // The rounds tab only exists once a round has actually been published.
    var hasRounds = !!(r.rounds && r.rounds.length);
    el('shTabs').hidden = !hasRounds;
    el('tabResult').textContent = r.state === 'none' ? 'Boats' : 'Result';
    if (!hasRounds) openView = 'result';
    el('tabResult').setAttribute('aria-selected', String(openView === 'result'));
    el('tabRounds').setAttribute('aria-selected', String(openView === 'rounds'));

    if (openView === 'rounds') {
      el('shBody').innerHTML = roundsHtml(r);
      el('shFoot').textContent = r.rounds.length === 1 ? '1 round published'
                                                       : r.rounds.length + ' rounds published';
      return;
    }

    var heading = r.state === 'final' ? (r.round ? r.round + ' — placings' : 'Placings')
                : r.state === 'round' ? (r.round ? r.round + ' — qualified' : 'Qualified')
                : 'Boats entered';
    el('shBody').innerHTML = '<div class="sh-sec">' + esc(heading) + '</div>' +
      (rows.length ? listHtml(rows, 0, true) : emptyNote(r));
    el('shFoot').textContent = r.state === 'final' ? 'Result published'
                             : r.state === 'round' ? 'Later rounds still to row'
                             : 'No result published yet';
  }

  function openSheet(sl, view) {
    var r = bySl[sl];
    if (!r) return;
    openView = view === 'rounds' ? 'rounds' : 'result';
    fillSheet(r);
    if (openSl === sl && sheet.hasAttribute('open')) { el('shBody').scrollTop = 0; return; }
    openSl = sl;
    lastFocus = document.querySelector('.card[data-sl="' + sl + '"]');
    if (modal) { sheet.showModal(); }
    else { el('shBack').hidden = false; sheet.setAttribute('open', ''); }
    document.body.classList.add('locked');
    el('shBody').scrollTop = 0;
    el('shClose').focus();
  }

  function closeSheet() {
    if (openSl === null) return;
    openSl = null;
    if (modal) { if (sheet.open) sheet.close(); }
    else { sheet.removeAttribute('open'); el('shBack').hidden = true; onClosed(); }
    document.body.classList.remove('locked');
  }

  /** Keep the address bar honest once the sheet is gone, whoever closed it. */
  function onClosed() {
    openSl = null;
    document.body.classList.remove('locked');
    if (/^#race-/.test(location.hash)) {
      if (pushed) { pushed = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); }
    }
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  function onHash() {
    var m = /^#race-(\d+)(?:-(rounds))?$/.exec(location.hash || '');
    if (m) openSheet(parseInt(m[1], 10), m[2]); else closeSheet();
  }

  function hashFor(sl, view) { return 'race-' + sl + (view === 'rounds' ? '-rounds' : ''); }

  // Anywhere on the card opens the result; the second link opens the rounds.
  function openFrom(target) {
    var card = target.closest && target.closest('.card');
    if (!card) return false;
    var link = target.closest('[data-view]');
    pushed = true;
    location.hash = hashFor(card.dataset.sl, link && link.dataset.view);
    return true;                                 // fires hashchange -> opens
  }

  el('cards').addEventListener('click', function (ev) { openFrom(ev.target); });
  el('cards').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    if (openFrom(ev.target)) ev.preventDefault();
  });

  // Switching tabs replaces the entry rather than pushing one, so Back always
  // closes the sheet instead of stepping between its tabs.
  el('shTabs').addEventListener('click', function (ev) {
    var tab = ev.target.closest('[data-view]');
    if (!tab || openSl === null) return;
    openView = tab.dataset.view;
    history.replaceState(null, '', '#' + hashFor(openSl, openView));
    fillSheet(bySl[openSl]);
    el('shBody').scrollTop = 0;
  });

  el('shClose').addEventListener('click', function () { closeSheet(); });
  el('shBack').addEventListener('click', function () { closeSheet(); });
  sheet.addEventListener('close', onClosed);
  sheet.addEventListener('click', function (ev) {
    // A click on the dialog element itself is a click on the backdrop area.
    if (ev.target === sheet) closeSheet();
  });
  window.addEventListener('hashchange', onHash);
  // Without showModal() there is no built-in Escape handling, so add it.
  if (!modal) document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && openSl !== null) closeSheet();
  });

  if (navigator.share || (navigator.clipboard && navigator.clipboard.writeText)) {
    var share = el('shShare');
    share.hidden = false;
    share.textContent = navigator.share ? 'Share' : 'Copy link';
    share.addEventListener('click', function () {
      var url = location.href;
      var title = (data && data.event ? data.event.name + ' — ' : '') + el('shTitle').textContent;
      if (navigator.share) { navigator.share({ title: title, url: url }).catch(function () {}); }
      else {
        navigator.clipboard.writeText(url).then(function () {
          share.textContent = 'Link copied';
          setTimeout(function () { share.textContent = 'Copy link'; }, 1800);
        }).catch(function () {});
      }
    });
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function render() {
    if (!data) return;
    var ev = data.event || {};
    document.title = (ev.name || 'Live Results') + ' — Results';
    el('evName').textContent = ev.name || 'Live Results';
    el('evReg').textContent  = ev.regional || '';
    el('evMeta').textContent = [ev.dates, ev.venue].filter(Boolean).join(' · ');

    bySl = {};
    (data.races || []).forEach(function (r) { bySl[r.sl] = r; });

    el('cards').innerHTML = (data.races || []).map(cardHtml).join('') ||
      '<div class="empty">No races have been published yet.</div>';

    var tally = data.tally || [];
    el('tallyBox').hidden = tally.length === 0;
    el('tallyRows').innerHTML = tally.map(function (t) {
      return '<tr><td>' + esc(t.club) + '</td><td class="n">' + t.gold + '</td><td class="n">' +
        t.silver + '</td><td class="n">' + t.bronze + '</td><td class="n"><strong>' +
        t.points + '</strong></td></tr>';
    }).join('');

    applyFilter();
    // A sheet left open while a new version lands must show the new result.
    if (openSl !== null && bySl[openSl]) fillSheet(bySl[openSl]);
    else if (openSl !== null) closeSheet();
  }

  function applyFilter() {
    var q  = (el('q').value || '').trim().toLowerCase();
    var st = el('st').value;
    var shown = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (c) {
      var ok = (!st || c.dataset.state === st) && (!q || c.dataset.hay.indexOf(q) !== -1);
      c.hidden = !ok;
      if (ok) shown++;
    });
    var grid = el('cards');
    var none = grid.querySelector('.empty.filtered');
    if (!shown && !none) {
      grid.insertAdjacentHTML('beforeend',
        '<div class="empty filtered">No races match that search.</div>');
    } else if (shown && none) {
      none.remove();
    }
  }

  // ── Loading ────────────────────────────────────────────────────────────
  // Only the tiny manifest is polled. The payload is versioned and immutable,
  // so it is fetched once per change and then cached by the browser and CDN.
  async function poll() {
    try {
      var res = await fetch(MANIFEST + '?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('manifest.json returned HTTP ' + res.status);
      var m = await res.json();

      if (m.version !== version) {
        var pr = await fetch(m.file, { cache: 'force-cache' });
        if (!pr.ok) throw new Error(m.file + ' returned HTTP ' + pr.status);
        data = await pr.json();
        version = m.version;
        render();
        onHash();   // honour a #race-N the visitor arrived with
      }
      failures = 0;
      setStatus('Updated ' + new Date(m.updated).toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit' }), '');
    } catch (err) {
      failures++;
      // Keep showing the last good data; say it may be behind rather than
      // blanking a page thousands of people are watching.
      if (data) {
        setStatus('Reconnecting…', 'stale');
      } else {
        // First load failed and there is nothing to show. Name the reason —
        // "not available yet" once hid a 403 from a server rule and gave
        // nobody anything to go on.
        setStatus(String(err && err.message || 'unavailable'), 'down');
        el('cards').innerHTML =
          '<div class="empty">Results are not available right now.' +
          '<div style="margin-top:6px;font-size:12px;color:#94a3b8">' +
          esc(String(err && err.message || 'unknown error')) + '</div></div>';
      }
    } finally {
      // Back off while hidden, and jitter so clients never align.
      var base = document.hidden ? POLL_MS * 3 : POLL_MS;
      var wait = base + Math.random() * JITTER + Math.min(failures, 5) * 5000;
      setTimeout(poll, wait);
    }
  }

  el('q').addEventListener('input', applyFilter);
  el('st').addEventListener('change', applyFilter);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && data) setStatus('Checking…', '');
  });

  poll();
})();
</script>
</body>
</html>
