---
# ═══════════════════════════════════════════════════════════════════════════
# cPanel Git™ Version Control — deployment tasks for SportsMIS® Regatta.
#
#   Repository path : /home/olympicd/repositories/sportsmis_com_boatrace
#   Deployment path : /home/olympicd/olympicday.in
#
# cPanel runs these tasks with the repository clone as the working directory
# whenever "Update from Remote" / "Deploy HEAD Commit" is used on a branch
# that carries this file.
#
# ── Before the first deploy ────────────────────────────────────────────────
#
#  1. DOCUMENT ROOT. The application's front controller is app/public/index.php,
#     so https://boatrace.olympicday.in must serve
#     /home/olympicd/olympicday.in/app/public — NOT the deployment path itself.
#     Set that under Domains → boatrace.olympicday.in → Document Root.
#
#     With the document root left at the deployment path, Apache finds no
#     index file there and serves a directory listing of the whole repository.
#     The root .htaccess in this repository covers that case: it disables
#     listings and rewrites every request into app/public. Keeping both means
#     the site works either way — but the document root is still the right fix.
#
#  2. app/.env is deliberately NOT deployed (it is gitignored, so it never
#     reaches the repository). Create it once on the server from
#     app/.env.example and fill in the real database credentials. It survives
#     every later deploy because nothing here touches it.
#
#  3. The database itself needs no migration step: every controller calls the
#     Models\Schema::ensureX() it depends on, and each checks INFORMATION_SCHEMA
#     before running any CREATE or ALTER. Deploying new code is enough.
#     For a brand-new database, import database/schema.sql first.
# ═══════════════════════════════════════════════════════════════════════════
deployment:
  tasks:
    - export DEPLOYPATH=/home/olympicd/olympicday.in/boatrace

    # Copy the working tree across. app/.env is not in the repository, so an
    # existing one on the server is left untouched.
    - /bin/cp -R . $DEPLOYPATH

    # Strip files that belong to the repository, not to the running site.
    # A served .git directory would leak the entire source history.
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -f  $DEPLOYPATH/.cpanel.yml
    - /bin/rm -f  $DEPLOYPATH/.gitignore

    # Dompdf (the printable programme and the rank-list / heat-sheet PDFs)
    # ships inside the repository under vendor/, so a deploy needs no composer
    # on the server at all — a deployment shell on shared hosting usually has
    # none on its PATH, which is what previously left the PDF routes dead.
    #
    # This step is therefore only a safety net for a checkout that somehow
    # arrives without vendor/. It looks in cPanel's own location as well as the
    # PATH, and stays silent when there is nothing to do.
    - /bin/bash -lc 'cd $DEPLOYPATH && if [ -f vendor/autoload.php ]; then echo "vendor/ present — skipping composer"; else COMPOSER=$(command -v composer || echo /opt/cpanel/composer/bin/composer); if [ -x "$COMPOSER" ]; then "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction --prefer-dist; else echo "WARNING: vendor/ is missing and composer was not found — PDF downloads will be unavailable"; fi; fi'

    # Directories the app writes to: uploaded event and club images, and
    # Dompdf's font cache / scratch space.
    - /bin/mkdir -p $DEPLOYPATH/app/public/assets/uploads/events
    - /bin/mkdir -p $DEPLOYPATH/app/public/assets/uploads/teams
    - /bin/mkdir -p $DEPLOYPATH/storage/dompdf
    - /bin/chmod -R 0755 $DEPLOYPATH/app/public/assets/uploads $DEPLOYPATH/storage
